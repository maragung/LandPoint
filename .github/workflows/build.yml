name: Build & Test

# Verification runs here rather than on a developer machine: this project's
# Gradle is deliberately capped to one worker and a 1 GB heap for an 8 GB
# laptop, so a full compile locally costs minutes of a machine someone is
# using. Release builds stay in release.yml, triggered by a v* tag.
on:
  push:
    # Every branch, not just main: this is the only place the project gets
    # compiled, so work in progress has to be able to reach it.
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee gradle-tests.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee gradle-build.log

      # R8 runs for the release build only, and release.yml runs it for the first
      # time on a v* tag — by which point the tag, and its release page, are public.
      # Building it here means a shrinking or ProGuard-rule mistake fails on a branch
      # instead, and the count doubles as proof that the ABI split still produces the
      # five APKs release.yml goes on to publish. Unsigned on purpose: the signing key
      # is a secret this workflow has no reason to hold.
      - name: Build release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee gradle-release.log
          # Unsigned here, so the file names carry a -unsigned suffix that the
          # signed release build does not; count every APK rather than match a name.
          count=$(ls -1 app/build/outputs/apk/release/*.apk | wc -l)
          test "$count" -eq 5 || { echo "expected 5 release APKs, built $count"; exit 1; }
          ls -l app/build/outputs/apk/release/

      # Downloading a job log needs write access to the repository, so a failure
      # here would otherwise be readable only by someone with admin rights. A
      # workflow command turns the compiler's own output into a check annotation,
      # which is public on the run page and in the API — the same place the failure
      # is already reported.
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          # No -e and no pipefail here: every grep below is allowed to match
          # nothing, and a reporting step that dies on its own empty output is how
          # the failure it was meant to explain goes unreported.
          set +e +o pipefail
          summarise() {
            # Kotlin ("e: file:///...") and javac ("...error:") diagnostics, plus
            # the JUnit lines Gradle prints for a failing test, and its own "What
            # went wrong" block for everything else.
            grep -hE '^e: |error: |^w: .*\berror\b|FAILED$|^\* What went wrong|^> ' "$@" 2>/dev/null |
              grep -v 'Execution failed for task' |
              head -n 60
          }
          # A failing test is named by Gradle but explained only in its XML result,
          # and that file is uploaded as an artifact an unauthenticated reader
          # cannot download. The assertion itself is what makes a red test
          # actionable, so it is lifted out here with the stack that produced it.
          failures() {
            awk '
              /<testcase / {
                split($0, a, "name=\""); split(a[2], b, "\""); test = b[1]
                split($0, c, "classname=\""); split(c[2], d, "\""); cls = d[1]
              }
              /<failure|<error/ { show = 1; print "FAILED " cls " > " test }
              show {
                gsub(/<[^>]*>/, "")
                gsub(/&quot;/, "\"")
                gsub(/&lt;/, "<"); gsub(/&gt;/, ">"); gsub(/&amp;/, "\\&")
                if (length($0)) { print; lines++ }
              }
              /<\/failure>|<\/error>/ { show = 0 }
              lines > 120 { exit }
            ' app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null
          }
          ls -l gradle-tests.log gradle-build.log gradle-release.log 2>&1 | sed 's/^/log: /'
          details=$(summarise gradle-tests.log gradle-build.log gradle-release.log; failures)
          if [ -z "$details" ]; then
            details=$(tail -n 40 gradle-tests.log gradle-build.log gradle-release.log 2>/dev/null)
          fi
          # Paths are absolute on the runner and add nothing here; the repository
          # path is what a reader needs.
          details=${details//file:\/\/\/home\/runner\/work\/LandPoint\/LandPoint\//}
          # Newlines and colons have to be escaped for a workflow command, and one
          # multi-line annotation is used rather than many because only the first
          # ten per step are kept.
          details=${details//'%'/'%25'}
          details=${details//$'\n'/'%0A'}
          details=${details//$'\r'/''}
          echo "::error title=Build failed::${details}"
          {
            echo '### Build failure'
            echo
            echo '```'
            summarise gradle-tests.log gradle-build.log gradle-release.log
            failures
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Warnings live in the job log, which needs write access to download — the same
      # reason a failure above is republished as an annotation. They are worth reading
      # on a green build too, since a deprecation is how a library announces the next
      # migration, so they go out the same way and stay readable to anyone.
      - name: Report warnings as annotations
        if: success()
        shell: bash
        run: |
          # Same reasoning as the failure step: a grep that matches nothing is the
          # expected case here, and must not fail the build.
          set +e +o pipefail
          warnings=$(grep -hE '^w: |warning: ' gradle-tests.log gradle-build.log gradle-release.log 2>/dev/null |
            sed 's#file:///home/runner/work/LandPoint/LandPoint/##' |
            sort -u |
            head -n 40)
          if [ -z "$warnings" ]; then
            echo "No compiler warnings."
            exit 0
          fi
          count=$(printf '%s\n' "$warnings" | wc -l | tr -d ' ')
          {
            echo "### Compiler warnings ($count)"
            echo
            echo '```'
            printf '%s\n' "$warnings"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          escaped=${warnings//'%'/'%25'}
          escaped=${escaped//$'\n'/'%0A'}
          escaped=${escaped//$'\r'/''}
          echo "::warning title=Compiler warnings ($count)::${escaped}"

      # Kept so a change can be installed on a phone straight from the run page,
      # without waiting for a release tag.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LandPoint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
