name: E2E (emulator)

# Instrumented end-to-end tests on GitHub, not on a developer machine.
# Manual or release-tag only: an emulator boot costs minutes, so this never
# runs on every branch push (unit tests + lint already do).
# No secrets needed: uses the default GITHUB_TOKEN only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still contains the obsolete
          # `tools` package and fails the whole step on a fresh runner image.
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
