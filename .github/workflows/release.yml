name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > landpoint-release.jks
            cat > keystore.properties <<EOF
            storeFile=landpoint-release.jks
            storePassword=$KEYSTORE_PASSWORD
            keyAlias=$KEY_ALIAS
            keyPassword=$KEY_PASSWORD
            EOF
            sed -i 's/^[[:space:]]*//' keystore.properties
            echo "Signing keystore restored from secrets."
          else
            echo "No KEYSTORE_BASE64 secret; release will be UNSIGNED."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/LandPoint-1.2.0-release.apk
          cp app/build/outputs/mapping/release/mapping.txt release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LandPoint-1.2.0-release
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LandPoint ${{ github.ref_name }}
          body: |
            LandPoint ${{ github.ref_name }} — release APK built automatically on GitHub.

            - APK: `LandPoint-1.2.0-release.apk`
            - Requires Android 9 (Pie) or newer; no Google Play Services needed.
            - Signed with the project release key; updating an existing install is safe.
          files: |
            release/LandPoint-1.2.0-release.apk
            release/mapping.txt
            release/SHA256SUMS