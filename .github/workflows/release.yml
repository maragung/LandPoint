name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Read from the build file rather than repeated in three filenames below,
      # so bumping the app version does not mean editing this workflow.
      - name: Read app version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$version" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building LandPoint $version"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > landpoint-release.jks
            printf 'storeFile=landpoint-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing keystore restored from secrets."
          else
            echo "No KEYSTORE_BASE64 secret; release will be UNSIGNED."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Five APKs: one per ABI plus a universal one. The per-ABI builds are what a
          # phone should get — each carries a single copy of the MapLibre and SQLCipher
          # native libraries instead of all four — and the universal APK is there for
          # anyone who does not know which their device is, or who keeps one file for
          # several phones.
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "release/LandPoint-$APP_VERSION-$abi.apk"
          done
          # Five, or the split configuration changed and the release notes below are
          # describing files that are not there.
          count=$(ls -1 release/*.apk | wc -l)
          test "$count" -eq 5 || { echo "expected 5 APKs, staged $count"; exit 1; }
          cp app/build/outputs/mapping/release/mapping.txt release/ 2>/dev/null || true
          # Checksums with bare file names, so `sha256sum -c SHA256SUMS` works in
          # whichever directory the user downloaded them into.
          (
            cd release
            files=(*.apk)
            if [ -f mapping.txt ]; then files+=(mapping.txt); fi
            sha256sum "${files[@]}" > SHA256SUMS
          )
          ls -l release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LandPoint-${{ env.APP_VERSION }}-release
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LandPoint ${{ github.ref_name }}
          body: |
            LandPoint ${{ github.ref_name }} — release APKs built automatically on GitHub.

            **Which file to install**

            | File | For |
            |---|---|
            | `LandPoint-${{ env.APP_VERSION }}-arm64-v8a.apk` | almost every phone from 2016 on — start here |
            | `LandPoint-${{ env.APP_VERSION }}-armeabi-v7a.apk` | older 32-bit ARM phones |
            | `LandPoint-${{ env.APP_VERSION }}-x86_64.apk` | emulators, Intel/AMD tablets |
            | `LandPoint-${{ env.APP_VERSION }}-x86.apk` | older 32-bit x86 emulators |
            | `LandPoint-${{ env.APP_VERSION }}-universal.apk` | works everywhere, larger — use if unsure |

            The per-ABI files are smaller because the map and database engines ship as
            native code: each one carries the libraries for a single processor instead
            of all four.

            - Requires Android 9 (Pie) or newer; no Google Play Services and no map API key needed.
            - Signed with the project release key; updating an existing install is safe.
            - `SHA256SUMS` lists the checksum of every file above — verify with `sha256sum -c SHA256SUMS`.
          files: |
            release/*.apk
            release/mapping.txt
            release/SHA256SUMS