name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read from the build file rather than repeated in three filenames below,
      # so bumping the app version does not mean editing this workflow.
      - name: Read app version
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$version" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building LandPoint $version"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > landpoint-release.jks
            printf 'storeFile=landpoint-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing keystore restored from secrets."
          else
            echo "No KEYSTORE_BASE64 secret; release will be UNSIGNED."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/LandPoint-$APP_VERSION-release.apk"
          cp app/build/outputs/mapping/release/mapping.txt release/ 2>/dev/null || true
          sha256sum release/* > release/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LandPoint-${{ env.APP_VERSION }}-release
          path: release/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LandPoint ${{ github.ref_name }}
          body: |
            LandPoint ${{ github.ref_name }} — release APK built automatically on GitHub.

            - APK: `LandPoint-${{ env.APP_VERSION }}-release.apk`
            - Requires Android 9 (Pie) or newer; no Google Play Services needed.
            - Signed with the project release key; updating an existing install is safe.
          files: |
            release/LandPoint-${{ env.APP_VERSION }}-release.apk
            release/mapping.txt
            release/SHA256SUMS