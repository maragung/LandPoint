# Tuned for a low-memory machine: slower builds, but no swap thrashing.
# Gradle and Kotlin run as separate daemons, so both heaps are capped.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC

# One task at a time. Parallel execution multiplies peak memory.
org.gradle.parallel=false
org.gradle.workers.max=1

# Lint gets its own short-lived JVM instead of loading every class it analyses
# into the long-lived Gradle daemon. A map SDK's worth of extra classes pushed the
# in-process run past the daemon's 384m metaspace once already; keeping lint out of
# the daemon fixes that without raising any cap, since the memory it needs is only
# held while it runs and is freed on exit.
android.experimental.runLintInProcess=false

# Caching costs disk, not RAM.
org.gradle.caching=true

kotlin.incremental=true
ksp.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
